<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dioma</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dioma">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--acc:#fff;--accrgb:255,255,255;--accink:#000;--bg:#000;--fg:#fff;--dim:#8b8b8b;--faint:#5a5a5a;--line:#1c1c1c;--line2:#2a2a2a;--card:#0a0a0a;--field:#0d0d0d;--bad:#ff7a6b;--good:#7ddc9a;
  --sans:'Inter Tight',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
html[data-tone=sun]{--acc:#ffb547;--accrgb:255,181,71;--accink:#1a0f00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
h1{font-size:30px;font-weight:400;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
p{margin:0}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-decoration:none}
.logo svg{width:20px;height:20px;display:block}
.logo .ring{transform-origin:10px 10px;animation:lspin 6s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#444}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn.bad{color:var(--bad);border-color:rgba(255,122,107,.35)}
.btn:disabled{opacity:.45;cursor:default}
.field{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--field);padding:0 14px;outline:none;font-size:16px}
.field:focus{border-color:rgba(var(--accrgb),.6)}
textarea.field{height:auto;min-height:48px;padding:12px 14px;resize:none;line-height:1.4}
.card{border:1px solid var(--line2);border-radius:16px;background:var(--card);padding:18px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px;min-height:20px}
.note{font-size:13px;color:var(--dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#151515;border:1px solid var(--line2);border-radius:999px;padding:10px 18px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

.tg{display:inline-flex;gap:2px;background:#111;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.tg button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--dim);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.tg button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tg button.on{background:var(--fg);color:#000}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media (max-width:380px){.tg button span{display:none}}
@media (max-width:420px){#today{display:none}}
.stabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 6px;padding:2px 0 10px;border-bottom:1px solid var(--line)}
.stabs::-webkit-scrollbar{display:none}
.stabs a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;color:var(--dim);font-size:12.5px;text-decoration:none;border-radius:12px}
.stabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stabs a.on{color:var(--fg);background:rgba(var(--accrgb),.12)}
.stabs a.on svg{stroke:var(--acc)}
.prov{display:grid;gap:10px}
.prov .item{border:1px solid var(--line2);border-radius:14px;padding:14px;align-items:center}
.soon{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;white-space:nowrap}
/* auth */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:40px}
.auth .card{padding:24px}
.code{letter-spacing:.4em;font-family:var(--mono);font-size:22px;text-align:center}

/* app shell */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:11}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
main{padding-block:22px calc(110px + env(safe-area-inset-bottom,0px))}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
#tabs{padding-top:14px}
.btn.mic{width:48px;height:48px;padding:0;flex:none}.btn.mic.rec{background:var(--bad);border-color:var(--bad);color:#000;animation:lpulse 1.2s infinite}
.live{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;color:var(--accink);background:var(--acc);border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--accink);animation:lpulse 1.6s infinite}
@keyframes lpulse{50%{opacity:.25}}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--accink);display:inline-flex;align-items:center;justify-content:center;font-weight:500;text-decoration:none;flex:none}
.stabs a,nav.bot a{position:relative}
.bdg{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--accink);font:500 10px/18px var(--mono);text-align:center}
.hello{font-size:clamp(34px,10vw,46px);font-weight:500;letter-spacing:-.03em;line-height:1.03;margin-top:8px}
.hello span{color:var(--acc)}
.sunrise{position:relative;height:74px;margin:18px 0 0;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#050505 0%,#0b0703 100%)}
.sunrise .sn{position:absolute;left:50%;bottom:-46px;width:118px;height:118px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#fff6e0 0,#ffd27a 26%,var(--acc) 52%,rgba(var(--accrgb),0) 72%);box-shadow:0 0 60px 18px rgba(var(--accrgb),.28);animation:srise 7s ease-in-out infinite alternate}
.sunrise .hz{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accrgb),.7),transparent)}
.sunrise .l{position:absolute;left:16px;top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
@keyframes srise{from{bottom:-58px}to{bottom:-38px}}
@media (prefers-reduced-motion:reduce){.sunrise .sn,.live i{animation:none}}
html:not([data-tone=sun]) .sunrise{filter:grayscale(1)}
.ycard{background:var(--acc);color:var(--accink);border-radius:22px;padding:18px 20px;margin-top:-1px}
.ycard .eyebrow{color:var(--accink);opacity:.75}
.ycard .btn{background:var(--accink);color:var(--acc);border-color:var(--accink)}
.ycard .bt{white-space:pre-wrap;font-size:16px;line-height:1.55;margin-top:6px}
.ycard .go{display:grid;gap:8px;margin-top:12px}
.ycard .go a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.08);color:var(--accink);text-decoration:none;font-weight:500}
.ycard .go a.ok{opacity:.55}
.ycard .go a span{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
@media (max-width:520px){#today{display:none}}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;padding:16px}#tabs:empty{display:none}
.pick{display:grid;gap:8px}.pick .item{align-items:center;flex-wrap:wrap}
.pick .seg button{padding:5px 11px;font-size:12.5px}
.morel{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.morel a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border:1px solid var(--line2);border-radius:14px;text-decoration:none;color:var(--fg);font-size:13px}
.morel a svg{width:26px;height:26px;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;text-decoration:none;color:var(--faint);font-size:11.5px;letter-spacing:.02em}
nav.bot a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.bot a.on{color:var(--fg)}
nav.bot a.on svg{stroke:var(--acc)}
.sec{display:grid;gap:10px;margin-top:26px}
.list{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.item .t{font-size:15px;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.when{font-family:var(--mono);font-size:12px;color:var(--dim);width:54px;flex:none;padding-top:2px}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line2);background:transparent;cursor:pointer;margin-top:1px;display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--acc)}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"";width:8px;height:4px;border:solid var(--accink);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{color:var(--faint);text-decoration:line-through}
.x{background:none;border:0;color:var(--faint);cursor:pointer;padding:2px 6px;font-size:18px;line-height:1}
.x:hover{color:var(--fg)}
.brief{font-size:19px;line-height:1.45;letter-spacing:-.01em;font-weight:300}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--dim);white-space:nowrap;text-decoration:none}
a.pill:hover{color:var(--fg)}
.sun{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(var(--accrgb),.9),transparent);margin:16px 0 0}
.empty{padding:16px 0;color:var(--faint);font-size:14px}

/* ask */
.chat{display:grid;gap:14px}
.msg{max-width:88%;padding:11px 15px;border-radius:18px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{justify-self:end;background:#161616;border:1px solid var(--line2)}
.msg.assistant{justify-self:start;padding-left:0;padding-right:0}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;background:linear-gradient(transparent,#000 30%);padding-top:18px}
.composer .row{gap:8px;padding-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:#cfcfcf}
.chip:hover{border-color:#444;color:var(--fg)}
.typing{display:inline-flex;gap:5px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

/* files */
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.crumbs button{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 0}
.crumbs button:last-child{color:var(--fg)}
.ficon{width:34px;height:34px;flex:none;border:1px solid var(--line2);border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase}
.ficon svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.5}
.inline{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
.seg{display:inline-flex;gap:4px;background:#111;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--dim);font-size:13.5px}
.seg button.on{background:var(--fg);color:#000}
@media (prefers-reduced-motion:reduce){.logo .ring{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const LOGO = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="46 7.4" stroke-linecap="round"/><circle cx="10" cy="10" r="2.6" fill="var(--acc)"/></svg>`;
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  ask:'<path d="M4 5h16v11H9l-5 4z"/>',
  todo:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  files:'<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  assistant:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  wa:'<path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/>',
  social:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5M15 15c2.8-.4 5 1.2 6 4.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  act:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 15l3.5-4 3 2.5L17 9"/>',
  biz:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12.5h18"/>',
  wealth:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/><circle cx="16.5" cy="14.5" r="1.5"/>',
  browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  ai:'<path d="M11 4l1.6 4.4L17 10l-4.4 1.6L11 16l-1.6-4.4L5 10l4.4-1.6z"/><circle cx="18.5" cy="5.5" r="1.5"/>',
};
const curTone = () => (document.documentElement.dataset.tone === 'sun' ? 'sun' : 'mono');
const TG = () => `<div class="tg" role="group" aria-label="Colour"><button type="button" data-tone="mono" class="${curTone() === 'mono' ? 'on' : ''}"><i style="background:#fff"></i><span>Mono</span></button><button type="button" data-tone="sun" class="${curTone() === 'sun' ? 'on' : ''}"><i style="background:#ffb547"></i><span>Sunrise</span></button></div>`;
function setTone(t) {
  if (t === 'sun') document.documentElement.dataset.tone = 'sun'; else delete document.documentElement.dataset.tone;
  try { localStorage.setItem('dioma-tone', t === 'sun' ? 'sun' : 'mono'); } catch {}
  document.querySelectorAll('.tg button').forEach((b) => b.classList.toggle('on', b.dataset.tone === t));
  document.querySelectorAll('#tone button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
}
document.addEventListener('click', (e) => { const b = e.target.closest('.tg [data-tone]'); if (b) setTone(b.dataset.tone); });
const ITEMS = [['home','Home','home'],['todo','To-do','todo'],['wa','WhatsApp','wa'],['social','Social','social'],['mail','Mail','mail'],['cal','Calendar','cal'],['act','Activity','act'],['wealth','Wealth','wealth'],['biz','Business','biz'],['ask','Assistant','ai'],['files','Files','files'],['browser','Browser','browser'],['me','Me','me']];
const KEYS = ITEMS.map((i) => i[0]);
const LABEL = Object.fromEntries(ITEMS.map((i) => [i[0], i[1]])), ICON = Object.fromEntries(ITEMS.map((i) => [i[0], i[2]]));
const DEF_NAV = { top: ['todo','wa','social','mail','cal','act','biz','ask'], bottom: ['home','ask','wealth','files','me'] };
const MAXB = 6;
const SHORT = { todo: 'To-do', wa: 'Wapp', cal: 'Cal', ask: 'AI', biz: 'Business' };
let BADGE = {};
// Saved bars + any new section added since they were saved goes to the top bar (so new features are never hidden).
const NAVP = () => { const n = S.me && S.me.nav; if (!(n && Array.isArray(n.top) && Array.isArray(n.bottom))) return DEF_NAV; const known = n.known || ['home','todo','wa','social','mail','cal','act','biz','ask','files','me']; const fresh = KEYS.filter((k) => !known.includes(k) && !n.top.includes(k) && !n.bottom.includes(k)); return fresh.length ? { ...n, top: [...n.top, ...fresh] } : n; };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const S = { me: null, folder: '', newFolders: [], chat: null, busy: false };
document.documentElement.dataset.tone = 'sun';
try { if (localStorage.getItem('dioma-tone') === 'mono') delete document.documentElement.dataset.tone; } catch {}

async function api(method, url, body, raw) {
  const opts = { method, headers: { 'x-dioma': '1' } };
  if (raw) { opts.body = raw; opts.headers['content-type'] = raw.type || 'application/octet-stream'; }
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers['content-type'] = 'application/json'; }
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { S.me = null; renderAuth(); throw new Error('signed out'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function toast(t) { document.querySelectorAll('.toast').forEach((x) => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const route = () => {
  const h = location.hash.slice(1); const [p, q] = h.split('?'); let [v, sub] = p.split('/');
  if (v === 'assistant') v = sub ? ({ me: 'todo', ai: 'ask' }[sub] || sub) : 'todo';
  if (v === 'ai') v = 'ask';
  if (!KEYS.includes(v) && v !== 'more') v = 'home';
  return { view: v, q: new URLSearchParams(q || '') };
};
// the screen currently showing
const cur = () => route().view;

// ---------- sign in ----------
function renderAuth(step = 'email', email = '') {
  $('#root').innerHTML = `<div class="wrap auth">
    <div class="brandrow"><a class="logo" href="https://dioma.life">${LOGO}DIOMA</a>${TG()}</div>
    <div class="stack" style="gap:10px"><h1>${step === 'email' ? 'Your day, handled.' : 'Check your email'}</h1>

  };
  draw();
  const c = document.createElement('div'); c.className = 'composer';
  c.innerHTML = `<form class="wrap row" id="cf"><button type="button" class="btn mic" id="mic" aria-label="Talk to Dioma">${MIC}</button><textarea class="field grow" id="q" rows="1" placeholder="Ask Dioma, or tap the mic and talk…" maxlength="4000"></textarea><button class="btn pri" aria-label="Send">Send</button></form>`;

  $('#cf').addEventListener('submit', (e) => { e.preventDefault(); const v = q.value; q.value = ''; q.style.height = 'auto'; ask(v); });
  $('#mic').addEventListener('click', (e) => { if (!S.me.voice) return toast('Voice is being switched on.'); micToggle(e.currentTarget, (t) => ask(t)); });

}

    if (b.dataset.mp === 'gmail' && S.me.googleAvailable) { location.href = '/auth/google'; return; }
    mailForm(b.dataset.mp);
  };
}
async function viewMail() {
  const main = $('#main');
  S.me = await api('GET', '/api/me').catch(() => S.me); await loadApps(true);
  if (cur() !== 'mail') return;
  const mailApps = ((APPS.catalog.mail) || []).filter(([k]) => appOn(k));
  if (!gOK() && !S.me.mailbox && !mailApps.length) {
    main.innerHTML = `<h1>Connect your mail</h1><p class="dim" style="margin:8px 0 18px">Which email do you use? Pick it and sign in. You can add more later.</p>${mailChooser()}`;
    return wireChooser();
  }
  main.innerHTML = `<h1>Mail</h1>
    ${gOK() ? `<section class="sec"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(S.me.google.account || 'Gmail')} · unread</h2></div><div class="list" id="ml"><div class="empty">Loading…</div></div></section>` : ''}
    ${S.me.mailbox ? `<section class="sec"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(S.me.mailbox)}</h2><button class="btn sm" id="mdis">Disconnect</button></div><div class="list" id="mi"><div class="empty">Loading…</div></div></section>` : ''}
    ${mailApps.map(([k, n]) => `<section class="sec"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${n}</h2><button class="btn sm" data-off="${k}">Disconnect</button></div><div class="list" data-inbox="${k}"><div class="empty">Loading…</div></div></section>`).join('')}
    <section class="sec"><h2>Add another mailbox</h2>${mailChooser()}</section>`;
  document.querySelectorAll('[data-inbox]').forEach(async (el) => { try { const d = await api('GET', '/api/apps/inbox?slug=' + el.dataset.inbox); el.innerHTML = d.mail.length ? d.mail.map((m) => `<div class="item"><span class="when">${m.at ? ago(m.at) : ''}</span><div class="grow"><div class="t">${esc(m.from)}</div><div class="s">${esc(m.subject)}</div></div></div>`).join('') : '<div class="empty">Inbox clear.</div>'; } catch (x) { el.innerHTML = `<div class="empty">${esc(x.message)}</div>`; } });
  wireChooser();
  $('#mdis')?.addEventListener('click', async () => { await api('DELETE', '/api/mail'); S.me.mailbox = null; toast('Mailbox disconnected'); viewMail(); });
  if (gOK()) api('GET', '/api/home').catch(() => ({ mail: [] })).then((d) => { if (!$('#ml')) return; $('#ml').innerHTML = d.mail.length ? d.mail.map((m) => `<a class="item" style="text-decoration:none" target="_blank" rel="noopener" href="https://mail.google.com/mail/u/0/#inbox/${esc(m.thread)}"><span class="when">${ago(m.at)}</span><div class="grow"><div class="t">${esc(m.from)}</div><div class="s">${esc(m.subject)}</div></div></a>`).join('') : '<div class="empty">Inbox clear.</div>'; });
  if (S.me.mailbox) api('GET', '/api/mail/inbox').then((d) => { if (!$('#mi')) return; $('#mi').innerHTML = d.mail.length ? d.mail.map((m) => `<div class="item"><span class="when">${ago(m.at)}</span><div class="grow"><div class="t" style="${m.unread ? '' : 'color:var(--dim)'}">${esc(m.from)}</div><div class="s">${esc(m.subject)}</div></div>${m.unread ? '<span class="soon" style="color:var(--acc)">New</span>' : ''}</div>`).join('') : '<div class="empty">Inbox empty.</div>'; }).catch((x) => { if ($('#mi')) $('#mi').innerHTML = `<div class="empty">${esc(x.message)}</div>`; });
}
async function viewCal() {
  const main = $('#main');
  await loadApps(true); if (cur() !== 'cal') return;
  const calApps = ((APPS.catalog.cal) || []).filter(([k]) => appOn(k));
  if (!gOK() && calApps.length) {
    main.innerHTML = `<h1>Calendar</h1><p class="dim" style="margin:8px 0 14px">Connected: ${calApps.map(([, n]) => esc(n)).join(', ')}</p><div class="list" id="cl"><div class="empty">Loading…</div></div><section class="sec"><h2>Add another calendar</h2>${appList('cal', 'cal')}</section>`;
    const d = await api('GET', '/api/apps/events').catch(() => ({ events: [] }));
    if ($('#cl')) $('#cl').innerHTML = d.events.length ? d.events.map((e) => `<div class="item"><span class="when">${e.allDay ? 'All day' : new Date(e.start).toLocaleString('en-GB', { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: S.me.tz })}</span><div class="grow"><div class="t">${esc(e.title)}</div>${e.where ? `<div class="s">${esc(e.where)}</div>` : ''}</div></div>`).join('') : '<div class="empty">Nothing in the next day and a half.</div>';
    return;
  }
  if (!gOK()) {
    main.innerHTML = `<h1>Calendar</h1><p class="dim" style="margin:8px 0 18px">Connect your calendar. Dioma plans your day around it and adds meetings when you approve.</p>
      ${APPS.enabled ? appList('cal', 'cal') : prov([['Google Calendar', 'Personal or Google Workspace', gHref()], ['Outlook Calendar', 'Outlook.com or Microsoft 365', ''], ['Zoho Calendar', 'Business calendar on Zoho', '']])}`;
    return;
  }
  main.innerHTML = `${stabs()}<h1>Today</h1><div class="list" id="cl" style="margin-top:14px"><div class="empty">Loading…</div></div>`;
  const d = await api('GET', '/api/home').catch(() => ({ events: [] }));
  if (cur() !== 'cal') return;
  $('#cl').innerHTML = d.events.length ? d.events.map((e) => `<div class="item"><span class="when">${hm(e.start, e.allDay)}</span><div class="grow"><div class="t">${esc(e.title)}</div>${e.where ? `<div class="s">${esc(e.where)}</div>` : ''}</div>${e.link ? `<a class="pill" href="${esc(e.link)}" target="_blank" rel="noopener">Join</a>` : e.where ? `<a class="pill" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.where)}">Map</a>` : ''}</div>`).join('') : '<div class="empty">Nothing on your calendar today.</div>';
}
async function viewActivity() {
  const main = $('#main');
  main.innerHTML = `${stabs()}<h1>Activity</h1><p class="dim" style="margin:8px 0 14px">What you and Dioma did recently.</p><div class="list" id="al"><div class="empty">Loading…</div></div>`;
  const [t, c] = await Promise.all([api('GET', '/api/todos').catch(() => ({ done: [] })), api('GET', '/api/chat').catch(() => ({ messages: [] }))]);
  if (cur() !== 'act') return;
  const rows = [...t.done.map((x) => [x.done_at, 'Done', x.text]), ...c.messages.filter((m) => m.role === 'user').map((m) => [m.at, 'Asked', m.text])].sort((a, b) => b[0] - a[0]).slice(0, 30);
  $('#al').innerHTML = rows.length ? rows.map(([at, k, x]) => `<div class="item"><span class="when">${ago(at)}</span><div class="grow"><div class="t">${esc(x)}</div></div><span class="soon">${k}</span></div>`).join('') : '<div class="empty">Nothing yet. Ask Dioma something or add a to-do.</div>';
}

// ---------- WhatsApp ----------
let waPoll = null, waOpen = null;
async function viewWa() {
  clearInterval(waPoll);
  const main = $('#main');
  const st = await api('GET', '/api/wa/status').catch(() => ({ status: 'none' }));
  if (cur() !== 'wa') return;
  if (st.status !== 'open') return waConnect(st);
  if (waOpen) return waChat(waOpen);
  main.innerHTML = `${stabs()}<div class="row" style="justify-content:space-between"><h1>WhatsApp</h1><button class="btn sm" id="wd">Disconnect</button></div>
    <input class="field" id="wq" placeholder="Search chats" style="margin-top:14px"><div class="list" id="wl" style="margin-top:12px"><div class="empty">Loading your chats…</div></div>`;
  const load = async () => {
    const d = await api('GET', '/api/wa/chats?q=' + encodeURIComponent($('#wq')?.value || '')).catch(() => ({ chats: [] }));
    if (cur() !== 'wa' || !$('#wl')) return;
    $('#wl').innerHTML = d.chats.length ? d.chats.map((c) => `<div class="item" data-jid="${esc(c.jid)}" data-name="${esc(c.name)}" style="cursor:pointer"><span class="ficon mono">${esc((c.name || '?').slice(0, 2).toUpperCase())}</span><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${c.last_from_me ? 'You: ' : ''}${esc(c.last_text || '')}</div></div><div style="display:grid;justify-items:end;gap:4px"><span class="note">${c.last_at ? ago(c.last_at) : ''}</span>${c.unread ? `<span class="pill" style="background:var(--acc);color:var(--accink);border-color:var(--acc)">${c.unread}</span>` : ''}</div></div>`).join('') : '<div class="empty">Your chats appear here in a minute or two after linking. New messages show up straight away.</div>';
  };
  await load();
  $('#wq').addEventListener('input', () => { clearTimeout(viewWa.t); viewWa.t = setTimeout(load, 250); });
  $('#wl').addEventListener('click', (e) => { const it = e.target.closest('[data-jid]'); if (!it) return; waOpen = { jid: it.dataset.jid, name: it.dataset.name }; waChat(waOpen); });
  $('#wd').addEventListener('click', () => { $('#wd').outerHTML = '<span class="row"><span class="note">Unlink WhatsApp and delete its chats from Dioma?</span><button class="btn sm bad" id="wd2">Disconnect</button></span>'; $('#wd2').addEventListener('click', async () => { await api('DELETE', '/api/wa'); toast('WhatsApp disconnected'); viewWa(); }); });
  waPoll = setInterval(() => { if (cur() === 'wa' && !waOpen) load(); else clearInterval(waPoll); }, 15000);
}
function waConnect(st) {
  const main = $('#main');
  main.innerHTML = `${stabs()}<h1>Connect WhatsApp</h1><p class="dim" style="margin:8px 0 16px">Dioma reads your chats, tells you who is waiting, and helps you reply. Nothing is sent until you tap Send.</p>
    <div class="card stack" id="wbox">${st.status === 'qr' && st.qr ? '' : `<ol class="dim" style="margin:0;padding-left:18px;line-height:1.7"><li>Tap <b style="color:var(--fg);font-weight:500">Show QR code</b></li><li>On your phone open WhatsApp → <b style="color:var(--fg);font-weight:500">Settings → Linked devices → Link a device</b></li><li>Point the phone at the code</li></ol>
      <button class="btn pri" id="wgo">${st.status === 'off' ? 'Reconnect WhatsApp' : 'Show QR code'}</button>
      <p class="note">This links Dioma like WhatsApp Web. WhatsApp does not officially support apps linked this way, so there is a small risk WhatsApp limits the account. You can disconnect any time and Dioma deletes your chats.</p>`}</div>`;
  const show = (s2) => {
    if (s2.status === 'open') { toast('WhatsApp connected'); return viewWa(); }
    if (s2.status === 'qr' && s2.qr) $('#wbox').innerHTML = `<p class="t" style="text-align:center">Scan with WhatsApp → Linked devices</p><img src="${s2.qr}" alt="WhatsApp QR code" style="width:260px;max-width:100%;justify-self:center;border-radius:12px;background:#fff;padding:8px"><p class="note" style="text-align:center">The code refreshes by itself. Keep this page open.</p>`;
    else if (s2.error && /Tap Try again/.test(s2.error)) $('#wbox').innerHTML = `<p class="err">${esc(s2.error)}</p><button class="btn" onclick="viewWa()">Try again</button>`;
    else if (s2.error) { const b = $('#wgo'); if (b) b.textContent = s2.error; }
  };
  const poll = () => { clearInterval(waPoll); waPoll = setInterval(async () => { if (cur() !== 'wa') return clearInterval(waPoll); show(await api('GET', '/api/wa/status').catch(() => ({}))); }, 2500); };
  if (st.status === 'qr') { show(st); poll(); }
  $('#wgo')?.addEventListener('click', async (e) => { e.target.disabled = true; e.target.textContent = 'Getting a code…'; show(await api('POST', '/api/wa/start').catch((x) => ({ error: x.message }))); poll(); });
}
async function waChat(c) {
  clearInterval(waPoll);
  const main = $('#main');
  main.innerHTML = `${stabs()}<button class="btn sm" id="wb">← Chats</button><h1 style="margin-top:12px">${esc(c.name)}</h1><div class="chat" id="wm" style="margin-top:16px"><div class="empty">Loading…</div></div>`;
  const load = async () => {
    const d = await api('GET', '/api/wa/messages?jid=' + encodeURIComponent(c.jid)).catch(() => ({ messages: [] }));
    if (!$('#wm')) return;
    $('#wm').innerHTML = d.messages.map((m) => `<div class="msg ${m.from_me ? 'user' : 'assistant'}" style="${m.from_me ? '' : 'background:var(--card);border:1px solid var(--line2);padding:11px 15px'}">${esc(m.text)}<div class="note" style="font-size:11px;margin-top:4px">${new Date(m.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div></div>`).join('') || '<div class="empty">No messages yet.</div>';
    window.scrollTo(0, document.body.scrollHeight);
  };
  await load();
  $('#wb').addEventListener('click', () => { waOpen = null; viewWa(); });
  const comp = document.createElement('div'); comp.className = 'composer';
  comp.innerHTML = `<form class="wrap row" id="wf"><textarea class="field grow" id="wt" rows="1" placeholder="Write a reply…" maxlength="4000"></textarea><button class="btn pri">Send</button></form>`;
  document.body.appendChild(comp); main.style.paddingBottom = '190px';
  $('#wf').addEventListener('submit', async (e) => { e.preventDefault(); const t = $('#wt').value.trim(); if (!t) return; try { await api('POST', '/api/wa/send', { jid: c.jid, text: t }); $('#wt').value = ''; toast('Sent'); load(); } catch (x) { toast(x.message); } });
  waPoll = setInterval(() => { if (cur() === 'wa' && waOpen) load(); else clearInterval(waPoll); }, 10000);
}

// ---------- boot ----------
let GOOGLE_ON = false;
async function boot(force, step) {
  try { GOOGLE_ON = !!(await (await fetch('/api/health')).json()).google; } catch {}
  const qerr = new URLSearchParams(location.search).get('err'); if (qerr) { history.replaceState(null, '', '/'); setTimeout(() => toast(qerr), 300); }
  // Arriving from dioma.life with an email: if someone else is signed in here, sign them out so the code goes to this email.
  const em0 = new URLSearchParams(location.search).get('email');
  if (em0) history.replaceState(null, '', '/' + location.hash); // never leave the email in the address bar
  try { S.me = await api('GET', '/api/me'); if (em0 && S.me.email !== em0.trim().toLowerCase()) { await api('POST', '/api/auth/logout').catch(() => {}); S.me = null; throw new Error('switch'); } } catch {
    renderAuth();
    if (em0) { $('#email').value = em0; $('#f').requestSubmit(); }
    return;
  }
  if (force === 'onboard' || !S.me.onboarded) return renderOnboard();
  const nx = new URLSearchParams(location.search).get('next'); if (nx && /^\/[a-z0-9-]+$/i.test(nx)) { location.replace(nx); return; }
  { const q = route().q; if (q.get('app') === 'connected') { toast('Connected'); history.replaceState(null, '', '#' + cur()); } if (q.get('app') === 'failed') { toast('Not connected. Try again.'); history.replaceState(null, '', '#' + cur()); } if (q.get('apperr')) { toast(q.get('apperr')); history.replaceState(null, '', '#' + cur()); } }
  if (route().q.get('google') === 'connected') { toast('Google connected'); history.replaceState(null, '', '#' + cur()); }
  shell();
}
boot();
