};
const curTone = () => (document.documentElement.dataset.tone === 'sun' ? 'sun' : 'mono');
const TG = () => `<div class="tg" role="group" aria-label="Colour"><button type="button" data-tone="mono" class="${curTone() === 'mono' ? 'on' : ''}"><i style="background:#fff"></i><span>Mono</span></button><button type="button" data-tone="sun" class="${curTone() === 'sun' ? 'on' : ''}"><i style="background:#ffb547"></i><span>Sunrise</span></button></div>`;
function setTone(t) {
  if (t === 'sun') document.documentElement.dataset.tone = 'sun'; else delete document.documentElement.dataset.tone;
  try { localStorage.setItem('dioma-tone', t === 'sun' ? 'sun' : 'mono'); } catch {}

document.addEventListener('click', (e) => { const b = e.target.closest('.tg [data-tone]'); if (b) setTone(b.dataset.tone); });
const ITEMS = [['home','Home','home'],['ai','Dioma AI','ai'],['todo','To-do','todo'],['wa','WhatsApp','wa'],['social','Social','social'],['mail','Mail','mail'],['cal','Calendar','cal'],['act','Activity','act'],['wealth','Wealth','wealth'],['biz','Business','biz'],['career','Career','career'],['grow','Grow','grow'],['network','Network','network'],['pulse','Pulse','pulse'],['learn','Learn AI','learn'],['plan','Master Plan','plan'],['money','Money','money'],['lab','AI Horizon','lab'],['files','Files','files'],['browser','Browser','browser'],['me','Me','me']];
const KEYS = ITEMS.map((i) => i[0]);
const LABEL = Object.fromEntries(ITEMS.map((i) => [i[0], i[1]])), ICON = Object.fromEntries(ITEMS.map((i) => [i[0], i[2]]));
const DEF_NAV = { top: ['todo','wa','social','mail','cal','act','biz','ask'], bottom: ['home','ai','wealth','files','me'] };
const MAXB = 6;
const SHORT = { ai: 'Dioma AI', todo: 'To-do', wa: 'Wapp', cal: 'Cal', ask: 'AI', biz: 'Business', learn: 'Learn', plan: 'Plan', lab: 'Horizon' };
let BADGE = {};

const NAVP = () => { const n = S.me && S.me.nav; if (!(n && Array.isArray(n.top) && Array.isArray(n.bottom))) return DEF_NAV; const known = n.known || ['home','todo','wa','social','mail','cal','act','biz','ask','files','me']; const fresh = KEYS.filter((k) => !known.includes(k) && !n.top.includes(k) && !n.bottom.includes(k)); if (!fresh.length) return n; const out = { ...n, top: [...n.top, ...fresh.filter((k) => k !== 'ai')], bottom: [...n.bottom] }; if (fresh.includes('ai')) { out.bottom.splice(1, 0, 'ai'); if (out.bottom.length > MAXB) out.top.push(out.bottom.pop()); } return out; };
const $ = (s, el = document) => el.querySelector(s);

async function api(method, url, body, raw) {
  const opts = { method, headers: { 'x-dioma': '1' } };
  if (raw) { opts.body = raw; opts.headers['content-type'] = raw.type || 'application/octet-stream'; }
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers['content-type'] = 'application/json'; }

// ---------- sign in ----------
function renderAuth(step = 'email', email = '') {
  $('#root').innerHTML = `<div class="wrap auth">

  </div>`;
  const f = $('#f'), err = $('#err'), go = $('#go');
  (step === 'email' ? $('#email') : $('#code')).focus();
  $('#back')?.addEventListener('click', () => renderAuth('email', email));
  if (step === 'code') $('#code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); if (e.target.value.length === 6) f.requestSubmit(); });
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; go.disabled = true;

        const em = $('#email').value.trim();

        renderAuth('code', em);

// ---------- onboarding ----------

// Turn any AI text into a send card (Dioma AI answers): pulls "Subject:" out and keeps the rest as the body.
function cardFromText(t, kind) {
  t = String(t || '').replace(/\*\*/g, '').trim();
  if (kind === 'post') return { card: 'post', text: t.replace(/^(here is|here's)[^\n]*\n+/i, '').replace(/^\s*Subject:.*\n+/im, '').trim() };
  if (kind === 'whatsapp') return { card: 'whatsapp', jid: '', name: '', text: t.replace(/^(here is|here's)[^\n]*\n+/i, '').replace(/^\s*Subject:.*\n+/im, '').trim() };
  const m = t.match(/^\s*Subject:\s*(.+)$/im); let body = t;
  if (m) body = t.slice(t.indexOf(m[0]) + m[0].length).trim();
  body = body.replace(/^(here is|here's)[^\n]*\n+/i, '');
  return { card: 'email', acct: '', to: '', cc: '', subject: m ? m[1].trim() : '', body };
}

// ---------- One composer for every reply box (like WhatsApp): reply box, Tell AI what to say + Write, AI reply, Fix, 😊, Send ----------
// opt: { ctx: 'what this reply is about', ai: 'instruction for AI reply', send: async (text) => {}, sendLabel, copyOnly }
function composer(box, opt) {
  box.classList.add('cmpz');
  box.innerHTML = `<textarea class="field" rows="3" placeholder="${esc(opt.placeholder || 'Write here…')}" data-draft="cmp:${hashK((opt.ctx || '') + (opt.sendLabel || '') + (opt.placeholder || ''))}"></textarea>

  const ta = box.querySelector('textarea');
  box.querySelector('[data-cins]').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); box.querySelector('[data-cx=write]').click(); } };
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-cx]'); if (!b || !box.contains(b)) return; e.stopPropagation(); const k = b.dataset.cx;
    if (k === 'copy') return copyT(ta.value);
    if (k === 'send') { const t = ta.value.trim(); if (!t) return toast('Write something first.'); if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to send'; return; } b.disabled = true; b.textContent = 'Sending…'; try { await opt.send(t); draftClear(ta); b.textContent = 'Sent ✓'; toast('Sent'); opt.done && opt.done(); } catch (x) { toast(x.message); b.disabled = false; b.dataset.sure = ''; b.textContent = opt.sendLabel || 'Send'; } return; }
    const ins = box.querySelector('[data-cins]').value.trim();

    const l = b.textContent; b.disabled = true; b.textContent = 'Writing…';
    try { const a = await aiAsk(`${opt.ctx}\n\n${k === 'write' ? `Write it saying: ${ins}` : k === 'fix' ? `Fix and polish this draft, keep its meaning and language: ${ta.value}` : opt.ai || 'Write a short, natural reply.'}\nNever use the em dash. Reply with only the text to post.`); setVal(ta, a.text.trim()); } catch (x) { toast(x.message); }
    b.disabled = false; b.textContent = l;
  });
  return ta;
}

      <div class="note">${f.thread ? `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 6 6v5"/></svg>Reply in thread "${esc(f.thread.subject || '')}"` : '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg>New email (no earlier thread found)'} · from ${f.via === 'zoho_mail' ? 'Zoho Mail' : f.via === 'gmail' ? 'Gmail' : '<span class="err">connect a mailbox</span>'}</div>
      <input class="field" data-pft="${i}" placeholder="Customer email" value="${esc(f.to)}"><textarea class="field" data-pfb="${i}" rows="6">${esc(f.body)}</textarea></div>`).join('')}</div>` : '<p class="note">Nothing overdue to chase.</p>'}

let PLT = 'day';

  const life = KVS.life || []; const e = { id: uidS(), at: Date.now(), text: String(text).slice(0, 20000), place: place || '', src, kind: 'note' };
  life.push(e); await kvSave('life', life.slice(-800)); if (cur() === 'pulse') drawPl();

    const a = await aiAsk(`Classify this life-log entry (Dubai, UAE; currency AED unless said otherwise). Entry: "${e.text.slice(0, 6000)}"${place ? ' Place: ' + place : ''}. Reply only JSON: {"kind":"expense|meeting|call|place|task|idea|note|health","title":"max 8 words","amount":number|null,"currency":"AED","category":"Food|Transport|Rent share|Phone & subscriptions|Fun|Savings|Business|Other","paid_by":"cash|card|other|","people":[names],"place":"","todo":"a follow-up to do, or empty"}`);
    const j = a.data || {}; Object.assign(e, { kind: PK[j.kind] ? j.kind : 'note', title: j.title || '', amount: Number(j.amount) || 0, currency: j.currency || 'AED', category: j.category || '', paid_by: j.paid_by || '', people: Array.isArray(j.people) ? j.people.slice(0, 6) : [], place: e.place || j.place || '' });

    <div class="row wbar" style="gap:6px;flex-wrap:wrap"><button class="btn sm" data-wa="reply">AI reply</button><button class="btn sm" data-wa="fix"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>Fix</button><button class="btn sm pri" data-wa="send">Send</button><button class="btn sm" data-emo title="Emoji" aria-label="Emoji"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9.5h.01M15 9.5h.01"/></svg></button><button class="btn sm" data-wa="voice"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</button><label class="btn sm" style="cursor:pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>Attach<input type="file" id="wfile" hidden></label><button class="btn sm" data-wa="ignore">Ignore</button><button class="btn sm" data-wa="noise">Move to Noise</button></div></div>`;
  document.body.appendChild(comp); main.style.paddingBottom = '260px';
  const box = $('#wt');
  const draft = async (mode, text, btn) => { const t0 = btn.textContent; btn.disabled = true; btn.textContent = 'Writing…'; try { const r = await api('POST', '/api/wa/draft', { jid: c.jid, mode, text }); setVal(box, r.text || ''); box.focus(); } catch (x) { toast(x.message); } btn.disabled = false; btn.textContent = t0; };
  $('#wai').addEventListener('submit', (e) => { e.preventDefault(); const t = $('#wi').value.trim(); if (!t) return toast('Tell Dioma what to say first.'); draft('write', t, e.submitter || $('#wai .btn')); });
  comp.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-wa]'); if (!b) return; const k = b.dataset.wa;
    if (k === 'voice') { let vr = comp.querySelector('.vrec'); if (!vr) { vr = document.createElement('div'); vr.className = 'vrec'; comp.querySelector('.wbar').after(vr); } return voiceRec(b, vr, c.jid, () => load()); }
    if (k === 'reply') return draft('reply', '', b);
    if (k === 'fix') { if (!box.value.trim()) return toast('Write something first, then tap Fix.'); return draft('fix', box.value, b); }
    if (k === 'send') { const t = box.value.trim(); if (!t) return toast('Write a message first.'); b.disabled = true; try { await api('POST', '/api/wa/send', { jid: c.jid, text: t }); draftClear(box); box.value = ''; $('#wi').value = ''; toast('Sent'); load(); } catch (x) { toast(x.message); } b.disabled = false; return; }
    if (k === 'ignore') { await api('POST', '/api/wa/ignore', { jid: c.jid }).catch(() => {}); toast('Ignored until they write again'); waOpen = null; comp.remove(); return viewWa(); }
    if (k === 'noise') { await api('POST', '/api/wa/noise', { jid: c.jid, on: true }).catch(() => {}); toast('Moved to Noise'); waOpen = null; comp.remove(); return viewWa(); }
  });
  $('#wfile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return; if (f.size > 15 * 1048576) return toast('Files up to 15 MB.');
    toast('Sending ' + f.name + '…');
    try { const r = await fetch(`/api/wa/sendfile?jid=${encodeURIComponent(c.jid)}&name=${encodeURIComponent(f.name)}&caption=${encodeURIComponent(box.value.trim())}`, { method: 'POST', headers: { 'content-type': f.type || 'application/octet-stream', 'x-dioma': '1' }, body: f }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Could not send the file.'); box.value = ''; toast('File sent'); load(); } catch (x) { toast(x.message); }
  });
  waPoll = setInterval(() => { if (cur() === 'wa' && waOpen) load(); else clearInterval(waPoll); }, 10000);
}

// ---------- boot ----------
let GOOGLE_ON = false;
async function boot(force, step) {
  try { GOOGLE_ON = !!(await (await fetch('/api/health')).json()).google; } catch {}
  const qerr = new URLSearchParams(location.search).get('err'); if (qerr) { history.replaceState(null, '', '/'); setTimeout(() => toast(qerr), 300); }
  // Arriving from dioma.life with an email: if someone else is signed in here, sign them out so the code goes to this email.
  const em0 = new URLSearchParams(location.search).get('email');
  if (em0) history.replaceState(null, '', '/' + location.hash); // never leave the email in the address bar
  try { S.me = await api('GET', '/api/me'); if (em0 && S.me.email !== em0.trim().toLowerCase()) { await api('POST', '/api/auth/logout').catch(() => {}); S.me = null; throw new Error('switch'); } } catch {
    renderAuth();
    if (em0) { $('#email').value = em0; $('#f').requestSubmit(); }
    return;
  }
  if (force === 'onboard' || !S.me.onboarded) return renderOnboard();
  const nx = new URLSearchParams(location.search).get('next'); if (nx && /^\/[a-z0-9-]+$/i.test(nx)) { location.replace(nx); return; }
  { const q = route().q; if (q.get('app') === 'connected') { toast('Connected'); history.replaceState(null, '', '#' + cur()); } if (q.get('app') === 'failed') { toast('Not connected. Try again.'); history.replaceState(null, '', '#' + cur()); } if (q.get('apperr')) { toast(q.get('apperr')); history.replaceState(null, '', '#' + cur()); } }
  if (route().q.get('google') === 'connected') { toast('Google connected'); history.replaceState(null, '', '#' + cur()); }
  shell();
}
boot();
</script>
