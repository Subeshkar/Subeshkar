<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subesh · Dioma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23fff' stroke-width='3' stroke-dasharray='103 16.4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23FFB547'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--acc:#fff;--accink:#000;--bg:#000;--fg:#fff;--dim:#8b8b8b;--line2:#2a2a2a;--card:#0a0a0a;--sans:'Inter Tight',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html[data-tone=sun]{--acc:#ffb547;--accink:#1a0f00}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:inline-flex;align-items:center;gap:10px;font:500 12px var(--mono);letter-spacing:.32em;text-decoration:none;color:var(--fg)}
.logo svg{width:22px;height:22px}.logo .ring{transform-origin:10px 10px;animation:sp 6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo .ring{animation:none}}
h1{font-weight:400;font-size:36px;letter-spacing:-.025em;line-height:1.1;margin:0}
.dim{color:var(--dim)}
.card{border:1px solid var(--line2);border-radius:18px;background:var(--card);padding:22px;display:grid;gap:14px}
.tag{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:4px 10px;justify-self:start}
.btn{height:52px;border-radius:999px;background:var(--acc);color:var(--accink);font-weight:500;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px}
.apps{display:flex;flex-wrap:wrap;gap:6px}.apps span{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;color:#cfcfcf;display:inline-flex;align-items:center;gap:6px}
.apps span::before{content:"";width:6px;height:6px;border-radius:50%;background:#7fd8c4}
.bar{height:3px;border-radius:3px;background:#1c1c1c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);animation:fill 2.6s ease-out forwards}@keyframes fill{to{width:100%}}
.note{font-size:13px;color:var(--dim)}a{color:var(--fg)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tg{display:inline-flex;gap:2px;background:#111;border:1px solid #1c1c1c;border-radius:999px;padding:2px;flex:none}
.tg button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font:500 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;color:#8b8b8b;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.tg button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tg button[aria-pressed=true]{background:#fff;color:#000}
</style>
</head>
<body>
<main class="wrap">
  <div class="brandrow"><a class="logo" href="https://dioma.life"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="46 7.4" stroke-linecap="round"/><circle cx="10" cy="10" r="2.8" fill="var(--acc)"/></svg>DIOMA</a><div class="tg" role="group" aria-label="Colour"><button type="button" data-tone="mono" aria-pressed="true"><i style="background:#fff"></i>Mono</button><button type="button" data-tone="sun" aria-pressed="false"><i style="background:#ffb547"></i>Sunrise</button></div></div>
  <div style="display:grid;gap:10px"><h1>Welcome back, Subesh.</h1><p class="dim">Your Dioma is live. Activated 15 November 2026.</p></div>
  <div class="card">
    <span class="tag">Founding customer #1 · live</span>
    <div class="apps"><span>WhatsApp</span><span>Mail</span><span>Calendar</span><span>Business</span><span>Files</span><span>Wealth</span></div>
    <div class="bar" id="bar"><i></i></div>
    <a class="btn" id="open" href="https://glorious-flexibility-production-c14c3fc8.up.railway.app/subeshkar">Open my Dioma</a>
    <p class="note" style="margin:0" id="msg">Opening your Dioma in a moment…</p>
  </div>
  <p class="note">Your Dioma opens in your secure account. If asked, sign in there once. <a href="https://dioma.life">dioma.life</a></p>
</main>
<script>
(function(){const set=(t)=>{if(t==='sun')document.documentElement.dataset.tone='sun';else delete document.documentElement.dataset.tone;document.querySelectorAll('.tg button').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.tone===t)));try{localStorage.setItem('dioma-tone',t)}catch(e){}};
let t='sun';try{t=localStorage.getItem('dioma-tone')==='mono'?'mono':'sun'}catch(e){}set(t);
document.querySelectorAll('.tg button').forEach((b)=>b.addEventListener('click',()=>set(b.dataset.tone)));})();

// Your Dioma runs on its own server: app.dioma.life once that address is live, its Railway address until then.
const APP = 'https://app.dioma.life/subeshkar', OLD = 'https://glorious-flexibility-production-c14c3fc8.up.railway.app/subeshkar';
let URL_ = OLD;
const ready = fetch('https://app.dioma.life/api/health', { mode: 'no-cors', cache: 'no-store' }).then(() => { URL_ = APP; document.getElementById('open').href = APP; }, () => {});
if (new URLSearchParams(location.search).get('stay') !== '1') setTimeout(async () => { await ready; location.href = URL_; }, 2600);
else { document.getElementById('bar').hidden = true; document.getElementById('msg').textContent = 'Tap to open your Dioma.'; }
</script>
</body>
</html>
