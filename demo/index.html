<html lang="en">
<head>
<meta charset="utf-8">

<title>Try Dioma</title>
<meta name="description" content="Try the full Dioma app with sample data: brief, to-do, WhatsApp, mail, calendar, invoices, money and files. Nothing is sent.">

<style>
:root{--bg:#000;--s1:#0B0B0B;--s2:#141414;--line:#1F1F1F;--line2:#2C2C2C;--fg:#fff;--mute:#9A9A9A;--faint:#5c5c5c;--y:#FFB547;--ys:rgba(255,181,71,.14);--ink:#1A0F00;--ok:#7FD8C4;--bad:#ff8a7a;
--sans:'Inter Tight',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html[data-tone=mono]{--y:#fff;--ys:rgba(255,255,255,.12);--ink:#000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--y)}
b,strong{font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{background:var(--y);color:var(--ink);font-size:12.5px;font-weight:500;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px))}
.demo a{color:var(--ink)}
.top{position:sticky;top:0;z-index:6;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:11px}.tone,.join{flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;letter-spacing:.32em;min-width:0}
.dlogo .ring{transform-origin:10px 10px;animation:dspin 6s linear infinite}@keyframes dspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dlogo .ring{animation:none}}
.live{font:500 10px var(--mono);letter-spacing:.12em;background:var(--y);color:var(--ink);border-radius:99px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pz 1.6s infinite}@keyframes pz{50%{opacity:.25}}
.tr{display:flex;align-items:center;gap:8px}
.tone{display:inline-flex;gap:2px;background:#111;border:1px solid var(--line);border-radius:99px;padding:2px}
.tone button{border:0;background:transparent;border-radius:99px;padding:5px 10px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.tone button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tone button[aria-pressed=true]{background:var(--fg);color:#000}
.join{background:var(--y);color:var(--ink);border:0;border-radius:99px;padding:7px 13px;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap}
h1{font-weight:400;letter-spacing:-.025em;font-size:34px;line-height:1.08;margin:6px 0 14px;text-wrap:balance}
h1 span{color:var(--y)}
h2{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--mute)}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-top:18px}
.sun{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--y),transparent);margin:6px 0 16px;opacity:.85}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;display:grid;gap:12px;min-width:0}
.ycard{background:var(--y);color:var(--ink);border-radius:22px;padding:18px}
.ycard .lbl{font:500 11px var(--mono);letter-spacing:.1em}
.ycard ul{margin:8px 0 0;padding-left:18px}.ycard li{margin:5px 0}
.item{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;min-width:0}
.item.click{cursor:pointer}.item.click:hover{border-color:var(--line2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.ttl{font-weight:500;overflow-wrap:anywhere}
.act{font-size:13px;color:var(--y)}
.pill{font:500 10px var(--mono);letter-spacing:.08em;border-radius:99px;padding:2px 8px;border:1px solid var(--line2);color:var(--mute);text-transform:uppercase;white-space:nowrap}
.pill.y{background:var(--y);color:var(--ink);border-color:var(--y)}
.pill.ok{color:var(--ok);border-color:rgba(127,216,196,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,138,122,.4)}
.btn{background:var(--y);color:var(--ink);border:0;border-radius:12px;min-height:40px;padding:0 16px;font-weight:500}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:12px;min-height:36px;padding:0 12px;font-weight:500;font-size:13px;color:var(--fg)}
.ghost:hover{border-color:#444}
.seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:32px;font-weight:500;font-size:12.5px;padding:0 11px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--y);color:var(--ink)}
.appr{border:1.5px solid var(--y);border-radius:16px;padding:12px 14px;display:grid;gap:10px;background:var(--s2)}
.appr .tag{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--y);text-transform:uppercase}
.appr pre{margin:0;white-space:pre-wrap;font:14px/1.5 var(--sans)}
.done{color:var(--ok);font-weight:500;font-size:13px}
.steps{display:grid;gap:6px}
.step{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;animation:stin .35s both}
@keyframes stin{from{opacity:0;transform:translateY(4px)}}
.step:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--y)}
.chat{display:grid;gap:10px}
.msg{max-width:86%;border-radius:18px;padding:9px 13px;white-space:pre-wrap;line-height:1.45;overflow-wrap:anywhere}
.msg .t{display:block;font:10.5px var(--mono);color:var(--mute);margin-top:3px;text-align:right}
.me{justify-self:end;background:var(--y);color:var(--ink);border-bottom-right-radius:4px}
.me .t{color:rgba(0,0,0,.55)}
.ai,.them{justify-self:start;background:var(--s2);border:1px solid var(--line);border-bottom-left-radius:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{background:var(--s2);border:1px solid var(--line2);border-radius:99px;min-height:34px;padding:6px 12px;font-size:13px;font-weight:500}
.bars{display:grid;gap:8px}
.bl{display:grid;grid-template-columns:110px 1fr 72px;gap:8px;align-items:center;font-size:13px}
.bl .b{height:8px;background:#222;border-radius:99px;overflow:hidden}
.bl .b i{display:block;height:100%;background:var(--y);border-radius:99px;width:0;transition:width 1s}
.bl em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.stat b{font-size:22px;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mute)}
.file{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line2);border-radius:10px;padding:5px 9px;background:var(--bg);max-width:100%}
textarea,.field{width:100%;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);padding:10px 12px;font:14px/1.5 var(--sans);outline:none}
textarea{min-height:110px;resize:vertical}
.field{height:42px}
textarea:focus,.field:focus{border-color:var(--y)}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0}
.chk.on{background:var(--y);border-color:var(--y)}
.chk.on::after{content:"";width:8px;height:4px;border:solid var(--ink);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.strike .ttl{text-decoration:line-through;color:var(--faint)}
.when{font:500 12px var(--mono);color:var(--mute);width:50px;flex:none}
.av{width:38px;height:38px;flex:none;border-radius:50%;background:#1d1d1d;border:1px solid var(--line2);display:grid;place-items:center;font:500 12px var(--mono);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);flex:none}
.back{background:none;border:0;color:var(--mute);padding:4px 0;font-size:14px}
.fic{width:36px;height:36px;flex:none;border:1px solid var(--line2);border-radius:9px;display:grid;place-items:center;font:500 9.5px var(--mono);color:var(--mute);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;text-align:left;color:var(--fg)}
.tile:hover{border-color:var(--line2)}
.tile svg{width:22px;height:22px;color:var(--y)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#000;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#9A978C;font-size:11px;font-weight:500;min-height:52px;justify-content:center;position:relative}
.bnav button .ic{width:40px;height:28px;border-radius:99px;display:grid;place-items:center}
.bnav button[aria-current=true]{color:var(--y)}
.bnav button[aria-current=true] .ic{background:var(--ys)}
.bnav svg,.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--y);color:var(--ink);font-size:10px;font-weight:500;border-radius:99px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;width:52px;height:52px;border-radius:50%;border:0;background:var(--y);color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#000;font-weight:500;font-size:13.5px;border-radius:99px;padding:9px 16px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.empty{color:var(--faint);font-size:14px;padding:6px 2px}
.stabs{display:grid;grid-template-columns:repeat(8,minmax(56px,1fr));gap:2px;overflow-x:auto;scrollbar-width:none;margin:10px -4px 4px;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.stabs::-webkit-scrollbar{display:none}
.stabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;color:var(--mute);font-size:13px;font-weight:500;position:relative;border-radius:12px}
.stabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stabs button[aria-pressed=true]{color:var(--fg);background:var(--ys)}
.stabs button[aria-pressed=true] svg{color:var(--y)}
.stabs .badge{top:0;left:calc(50% + 8px)}
.hide{display:none!important}
.join .gs{display:none}
@media (max-width:430px){.brand .live{display:none}.brand{letter-spacing:.2em;gap:8px}.tone button{padding:5px 8px}.join .gd{display:none}.join .gs{display:inline}.join{padding:7px 11px}}
</style>
</head>
<body>
<div class="demo">Demo with made-up people and data. Nothing is sent. <a href="https://dioma.life">Back to dioma.life</a></div>
<div class="top"><div class="wrap bar">
  <div class="brand"><svg class="dlogo" width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="8.5" stroke="#fff" stroke-width="1.3" stroke-dasharray="46 7.4" stroke-linecap="round"/><circle cx="10" cy="10" r="3.2" fill="var(--y)"/></svg>DIOMA <span class="live"><i></i>DEMO</span></div>
  <div class="tr"><div class="tone" role="group" aria-label="Colour"><button type="button" data-tone="mono" aria-pressed="false"><i style="background:#fff"></i><span>Mono</span></button><button type="button" data-tone="sun" aria-pressed="true"><i style="background:#FFB547"></i><span>Sunrise</span></button></div>
  <a class="join" id="join"><span class="gd">Sign up</span><span class="gs">Sign up</span></a></div>
</div></div>

<main class="wrap" id="view"></main>
<button class="fab" id="fab" aria-label="Ask Dioma"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></button>
<nav class="bnav" aria-label="Demo sections"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
document.getElementById('join').href = 'https://dioma.life/signup/';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); };
const SIG = '\n\nBest regards,\nSara Khan\nSwift Cold Logistics';

// ---- tone (Mono / Sunrise) ----
function setTone(t) {
  if (t === 'mono') document.documentElement.dataset.tone = 'mono'; else delete document.documentElement.dataset.tone;
  $$('[data-tone]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tone === t)));
  try { localStorage.setItem('dioma-tone', t); } catch {}
}
try { setTone(localStorage.getItem('dioma-tone') || 'sun'); } catch { setTone('sun'); }
document.addEventListener('click', (e) => { const b = e.target.closest('[data-tone]'); if (b) { setTone(b.dataset.tone); if (S.tab === 'more' && S.more === 'settings') render(); } });

const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  assistant: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  pulse: '<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  wealth: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  files: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  career: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/>',
  grow: '<path d="M12 21V11M12 11C12 7 9 5 5 5c0 4 3 6 7 6zM12 13c0-3 2.5-5 6-5 0 3.5-2.5 5-6 5z"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
};
const NAV = [['home', 'Home'], ['assistant', 'Assistant'], ['pulse', 'Pulse'], ['wealth', 'Wealth'], ['more', 'More']];
const SUBS = [['me', 'Me'], ['wa', 'Wapp'], ['social', 'Social'], ['mail', 'Mail'], ['cal', 'Cal'], ['act', 'Activity'], ['biz', 'Business'], ['ai', 'AI']];
const SIC = {
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  wa: '<path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/>',
  social: '<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5M15 15c2.8-.4 5 1.2 6 4.5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>',
  act: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 15l3.5-4 3 2.5L17 9"/>',
  biz: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12.5h18"/>',
  ai: '<path d="M11 4l1.6 4.4L17 10l-4.4 1.6L11 16l-1.6-4.4L5 10l4.4-1.6z"/><circle cx="18.5" cy="5.5" r="1.5"/>',
};

// ---- sample data (all fictional) ----
const D = {
  wa: [
    { id: 'w1', name: 'Ahmed (driver)', ini: 'AH', ago: '9m', unread: 2, urgent: true, msgs: [['them', 'Good morning boss', '08:41'], ['them', 'Truck 3 tyre is low, can I go to the garage first?', '08:42']], draft: 'Yes, go to the garage first and send me the bill photo. Tell Harbor Foods you will be 30 minutes late.' },
    { id: 'w2', name: 'Priya · Bright Kids', ini: 'PR', ago: '1h', unread: 1, msgs: [['me', 'Hi Priya, invoice INV-1038 is attached.', 'Tue'], ['them', 'Thanks! Can you send the copy again? Our accounts lost it.', '09:55']], draft: 'Sure Priya, sending INV-1038 again now. Let me know if anything else is needed.', attach: 'INV-1038.pdf' },
    { id: 'w3', name: 'Mum', ini: 'MU', ago: '3h', unread: 1, msgs: [['them', 'Are you coming for dinner on Friday?', '07:30']], draft: 'Yes Amma, I will be there by 8. Do you need anything from the shop?' },
    { id: 'w4', name: 'Omar · Desert Cold', ini: 'OM', ago: '22d', unread: 0, waiting: 22, msgs: [['me', 'Hi Omar, did you get a chance to review the warehouse quote?', '24 Oct']], draft: 'Hi Omar, just checking in on the warehouse quote from last month. Happy to adjust the storage period if that helps.' },
    { id: 'w5', name: 'Team · Ops', ini: 'OP', ago: '1d', unread: 0, msgs: [['them', 'All 6 trucks back, temps OK ✅', 'Sat']] },
  ],
  mail: [
    { id: 'm1', box: 'action', from: 'Noor Al Hashimi', org: 'Falcon Freight', email: 'noor@falconfreight.example', subj: 'Rates for December chilled trips', ago: '1h', urgent: true, act: 'Send the December rate card and confirm 2 extra trucks', body: 'Hi Sara,\n\nCan you share December rates for chilled trips, and confirm if two extra chiller trucks are possible from the 3rd?\n\nThanks,\nNoor', draft: 'Hi Noor,\n\nThank you for reaching out. Our December chilled rates are attached and are the same as November. Two extra chiller trucks are confirmed from 3 December.', attach: 'Rate card December.pdf' },

    <div class="seg" style="margin-top:10px">${F.map(([k, l]) => `<button data-box="${k}" aria-pressed="${S.mailBox === k}">${l}</button>`).join('')}</div>
    <div class="panel" id="ml">${L.map((m) => `<div class="item click" data-m="${m.id}"><div class="row">${m.urgent ? '<span class="pill y">Urgent</span>' : ''}${m.waiting ? `<span class="pill">${m.waiting} days</span>` : ''}<span class="ttl grow">${esc(m.subj)}</span><span class="sub">${m.ago}</span></div><div class="sub">${esc(m.from)}${m.org ? ' · ' + esc(m.org) : ''}</div>${m.act ? `<div class="act">→ ${esc(m.act)}</div>` : ''}</div>`).join('') || '<p class="empty">Nothing here. 👏</p>'}</div>
    <p class="sub">Personal Gmail and company Zoho in one list. Promotions are kept out of your way.</p>`;
};
SB.mail = () => {
  $$('[data-box]').forEach((b) => (b.onclick = () => { S.mailBox = b.dataset.box; render(); }));
  $$('[data-m]').forEach((r) => (r.onclick = () => { S.openMail = r.dataset.m; render(); scrollTo({ top: 0 }); }));
  const q = $('#ms2'); if (q) q.oninput = () => { const v = q.value.toLowerCase(); const hits = D.mail.filter((m) => (m.subj + m.from + (m.org || '') + m.body).toLowerCase().includes(v)); $('#ml').innerHTML = v ? hits.map((m) => `<div class="item click" data-m="${m.id}"><span class="ttl">${esc(m.subj)}</span><div class="sub">${esc(m.from)} · ${m.box}</div></div>`).join('') || '<p class="empty">No match.</p>' : ''; $$('[data-m]').forEach((r) => (r.onclick = () => { S.openMail = r.dataset.m; render(); })); if (!v) render(); };
  const bk = $('[data-back]'); if (bk) bk.onclick = () => { S.openMail = null; render(); };
  const s = $('#ms'); if (s) s.onclick = () => { S.done.add(S.openMail); render(); toast('Demo: sent once ✓ — removed from Me and Mail'); };
  const nn = $('[data-nn2]'); if (nn) nn.onclick = () => { S.notNeeded.add(nn.dataset.nn2); S.openMail = null; render(); toast('Won’t suggest this again'); };
  const a = $('#ma'); if (a) a.onclick = () => { $('#pick').innerHTML = `<div class="item">${S.files.slice(0, 6).map((f, i) => `<button class="ghost" data-pf="${i}" style="justify-content:flex-start;text-align:left">📎 ${esc(f.n)} <span class="sub">· ${esc(f.f)}</span></button>`).join('')}</div>`; $$('[data-pf]').forEach((b) => (b.onclick = () => { $('#atts').insertAdjacentHTML('beforeend', `<span class="file">📎 ${esc(S.files[+b.dataset.pf].n)}</span>`); $('#pick').innerHTML = ''; })); };
};

// Calendar
SV.cal = () => `<div class="panel" style="margin-top:14px"><h2>Today · Sunday 15 Nov</h2>
  ${D.cal.map((c) => `<div class="item" style="${c.done ? 'opacity:.45' : ''}"><div class="row"><span class="when">${c.t}</span><div class="grow"><div class="ttl">${esc(c.title)}</div><div class="sub">${c.t}–${c.end} · ${esc(c.where)}</div></div>
    ${c.link && !c.done ? `<button class="ghost" data-join="${c.link}">Join ${c.link === 'teams' ? 'Teams' : 'Meet'}</button>` : c.map ? '<button class="ghost" data-mapb>Map ↗</button>' : c.personal ? '<span class="pill">Can move</span>' : ''}</div></div>`).join('')}</div>
  ${S.done.has('meet') ? '<div class="panel"><p class="done">✓ Tuesday 11:00 at Harbor Foods added, and Daniel has a reply waiting for your OK in Mail.</p></div>' : `<div class="appr"><div class="tag">Meeting request · found in Mail</div><div><b>Daniel Moore · Harbor Foods</b> wants to meet on Tuesday.</div><div class="sub">You’re free 11:00–12:00 and 15:00–16:00. You prefer to meet in person — their office is in DIP.</div><div class="row"><button class="btn" id="acc">Accept 11:00 in person</button><button class="ghost" id="acc2">Suggest 15:00</button></div></div>`}
  <p class="sub">Business meetings never move without your OK. Personal things like the gym can be moved to make room.</p>`;
SB.cal = () => {
  $$('[data-join]').forEach((b) => (b.onclick = () => toast('Demo: would open the meeting link')));
  $$('[data-mapb]').forEach((b) => (b.onclick = () => toast('Demo: would open Google Maps')));
  const a = $('#acc'), a2 = $('#acc2');
  if (a) a.onclick = () => { S.done.add('meet'); render(); toast('Added to calendar (demo)'); };
  if (a2) a2.onclick = () => { S.done.add('meet'); render(); toast('Suggested 15:00 (demo)'); };
};

// Business
SV.biz = () => {
  const sub = D.invLines.reduce((s, l) => s + l[1] * l[2], 0), vat = sub * 0.05;
  const steps = ['Found the email from Sky Mart', 'Opened October Trip Details.xlsx', 'Counted 10 trips', 'Found Sky Mart in your Books', 'Added 5% VAT'];
  return `<div class="panel" style="margin-top:14px"><h2>Email in, invoice out</h2>
    <div class="item"><span class="ttl">Sky Mart: October trip details — please invoice</span><div class="sub">accounts@skymart.example · 5h ago</div><span class="file">📎 October Trip Details.xlsx</span></div>
    ${S.inv === 0 ? '<button class="btn" id="mk">Create the invoice</button>' : ''}
    <div class="steps" id="steps">${S.inv >= 1 ? steps.map((t) => `<div class="step">${t}</div>`).join('') : ''}</div>
    ${S.inv >= 1 ? `<div class="appr"><div class="tag">Invoice INV-${S.invNo} · draft · waiting for your OK</div><pre>To: Sky Mart (accounts@skymart.example)
${D.invLines.map((l) => `• ${l[0]}: ${l[1]} × ${l[2]} = ${(l[1] * l[2]).toLocaleString()}`).join('\n')}
Subtotal: AED ${sub.toLocaleString()}
VAT 5%: AED ${vat.toFixed(2)}
<b>Total: AED ${(sub + vat).toLocaleString(undefined, { minimumFractionDigits: 2 })}</b></pre>
      ${S.inv === 1 ? '<div class="row"><button class="btn" id="ok">Approve &amp; email PDF</button><button class="ghost" id="no">Cancel</button></div>' : '<div class="done">✓ INV-' + S.invNo + ' emailed to Sky Mart as PDF (demo — nothing really sent)</div>'}</div>` : ''}</div>
  <div class="panel"><div class="row sp"><h2>Money owed to you</h2><span class="pill">AED 18.4k</span></div>
    ${D.owed.map(([n, v, d]) => `<div class="row"><span class="grow">${n}</span><span class="pill ${d > 14 ? 'bad' : d > 0 ? 'y' : ''}">${d > 0 ? d + ' days late' : 'due in ' + -d + ' days'}</span><b style="width:80px;text-align:right">${v.toLocaleString()}</b></div>`).join('')}
    <button class="ghost" id="chase">Write a polite reminder to Sky Mart</button><div id="chaseOut"></div></div>
  <div class="panel"><h2>Purchase orders</h2><div class="item"><div class="row"><span class="ttl grow">PO-0412 · Tyre replacement, truck 3</span><span class="pill">Draft</span></div><div class="sub">To Gulf Tyres · AED 1,260.00 incl. VAT · created from Ahmed’s WhatsApp</div><div class="row"><button class="ghost" id="po">Approve &amp; send</button></div></div></div>
  <div class="panel"><h2>Leads</h2>${D.leads.map(([n, s, h]) => `<div class="row"><span class="grow"><b>${n}</b><div class="sub">${s}</div></span><span class="pill ${h === 'hot' ? 'y' : ''}">${h}</span></div>`).join('')}</div>`;
};
SB.biz = () => {
  const mk = $('#mk'); if (mk) mk.onclick = () => { mk.disabled = true; mk.textContent = 'Dioma is working…'; const st = $('#steps'); ['Found the email from Sky Mart', 'Opened October Trip Details.xlsx', 'Counted 10 trips', 'Found Sky Mart in your Books', 'Added 5% VAT'].forEach((t, i) => setTimeout(() => st.insertAdjacentHTML('beforeend', `<div class="step">${t}</div>`), 450 * (i + 1))); setTimeout(() => { S.inv = 1; render(); }, 2800); };
  const ok = $('#ok'); if (ok) ok.onclick = () => { S.inv = 2; S.done.add('m3'); render(); toast('Demo: invoice emailed ✓'); };
  const no = $('#no'); if (no) no.onclick = () => { S.inv = 0; render(); };
  const po = $('#po'); if (po) po.onclick = () => { po.outerHTML = '<span class="done">✓ PO-0412 sent to Gulf Tyres (demo)</span>'; };
  const ch = $('#chase'); if (ch) ch.onclick = () => { $('#chaseOut').innerHTML = `<div class="appr"><div class="tag">Reminder written by Dioma</div><textarea>Dear Sky Mart Accounts,\n\nA gentle reminder that INV-1031 for AED 9,200.00 was due 18 days ago. Could you share the payment date? A copy is attached.${SIG}</textarea><span class="file">📎 INV-1031.pdf</span><div class="row"><button class="btn" onclick="this.closest('.appr').innerHTML='<span class=done>✓ Reminder sent (demo)</span>'">Approve &amp; send</button></div></div>`; };
};

// Ask
const ANS = {
  'How does my day look?': '• 11:00 site visit at Harbor Foods (leave by 10:25)\n• 14:00 Falcon Freight call — they want December rates; the reply is drafted\n• Ahmed is waiting on WhatsApp about truck 3\n• Gym 18:30 can move if needed',
  'Who owes me money?': '• Sky Mart: AED 9,200 — 18 days late\n• Bright Kids: AED 5,700 — 9 days late\n• Harbor Foods: AED 3,500 — due in 3 days\nWant me to write a polite reminder to Sky Mart?',
  'Find my Emirates ID': 'Found it in Files › Personal › IDs: “Emirates ID.jpg” (640 KB). I can attach it to any email or WhatsApp.',
  'Remind me to call the bank tomorrow': 'Done — added “Call the bank” to your to-do for tomorrow.',
  'Write a LinkedIn post about our new trucks': 'Cold chain doesn’t take a day off. This week we added two new chiller trucks to keep fresh food moving across the UAE — on time and at the right temperature.\n\nThank you to our clients for trusting us with what matters most.\n\n(Share it? I won’t post without your OK.)',
};
SV.ai = () => `<div class="panel" style="margin-top:14px"><div class="chat" id="chat">${S.chat.length ? S.chat.map((m) => `<div class="msg ${m.me ? 'me' : 'ai'}">${esc(m.t)}</div>`).join('') : '<div class="msg ai">Hi Sara, I’m Dioma. Ask me anything about your day, your money or your files.</div>'}</div>
  <div class="quick">${Object.keys(ANS).map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <form class="row" id="askf"><input class="field grow" id="askq" placeholder="Type a question…"><button class="btn">Ask</button></form></div>
  <p class="sub">In your own Dioma, answers come from your real mail, chats, calendar and files — by typing or voice.</p>`;
SB.ai = () => {
  const ask = (q) => { S.chat.push({ me: true, t: q }); render(); const c = $('#chat'); c.insertAdjacentHTML('beforeend', '<div class="msg ai" id="typ">…</div>');
    setTimeout(() => { const k = Object.keys(ANS).find((x) => x.toLowerCase() === q.toLowerCase()) || Object.keys(ANS).find((x) => q.toLowerCase().split(/\W+/).filter((w) => w.length > 3).some((w) => x.toLowerCase().includes(w)));
      const rm = q.match(/remind me to\s+(.+)/i); const task = rm ? rm[1].replace(/\s*tomorrow\s*$/i, '').replace(/^\w/, (c) => c.toUpperCase()) : '';
      if (rm) S.todos.unshift({ id: Date.now(), t: task, due: 'Tomorrow', done: false });
      S.chat.push({ t: rm ? `Done — added “${task}” to your to-do for tomorrow.` : k ? ANS[k] : 'In the demo I only know Sara’s sample day. In your own Dioma I’d answer that from your real mail, chats and files.' }); render(); $('#askq')?.focus(); }, 700); };
  $$('[data-q]').forEach((b) => (b.onclick = () => ask(b.dataset.q)));
  $('#askf').onsubmit = (e) => { e.preventDefault(); const v = $('#askq').value.trim(); if (v) ask(v); };
};

// ---------- Pulse ----------
V.pulse = () => `<div class="eyebrow">Pulse · picked for your work</div><h1>What <span>matters</span> today</h1>
  <div class="panel">${D.pulse.map(([c, h, w]) => `<div class="item"><span class="pill" style="justify-self:start">${c}</span><span class="ttl">${esc(h)}</span><div class="act">${esc(w)}</div></div>`).join('')}</div>
  <p class="sub">Demo headlines are samples. Your Pulse picks real news for your industry, your clients and your money — and says why each one matters to you.</p>`;

// ---------- Wealth ----------
V.wealth = () => `<div class="eyebrow">Wealth · November</div><h1>Where your money <span>goes</span></h1>
  <div class="stats"><div class="stat"><b>48.2k</b><span>AED in</span></div><div class="stat"><b>31.8k</b><span>AED out</span></div><div class="stat"><b style="color:var(--y)">16.4k</b><span>kept</span></div></div>
  <div class="panel"><h2>Spending</h2><div class="bars">${[['Salaries', 12400], ['Vehicle lease', 7800], ['Fuel', 4300], ['Rent', 3500], ['Salik & fines', 1650], ['Software', 1100], ['Other', 1000]].map(([n, v]) => `<div class="bl"><span>${n}</span><span class="b"><i data-w="${Math.round((v / 12400) * 100)}"></i></span><em>${v.toLocaleString()}</em></div>`).join('')}</div>
    <div class="item"><span class="act">Tip: Salik and fines are up 40% this month — mostly truck 2. Want a list of the fines?</span></div></div>
  <div class="panel"><h2>Bills due</h2>${[['DEWA', '820', 'in 4 days'], ['du business', '399', 'in 6 days'], ['Truck lease', '7,800', 'on the 1st']].map(([n, v, d]) => `<div class="row"><span class="grow">${n}</span><span class="sub">${d}</span><b style="width:70px;text-align:right">${v}</b></div>`).join('')}</div>
  <div class="panel"><h2>Savings goal</h2><div class="row sp"><span>Second chiller truck</span><span class="sub">62%</span></div><div class="bl" style="grid-template-columns:1fr"><span class="b"><i data-w="62"></i></span></div><p class="sub" style="margin:0">At this month’s pace you reach it in about 4 months.</p></div>
  <p class="sub">Dioma reads your bank statements (PDF or Excel) and sorts every line for you.</p>`;

// ---------- More ----------
V.more = () => {
  if (S.more === 'files') return filesView();
  if (S.more === 'settings') return settingsView();
  if (S.more === 'career') return `<button class="back" data-mb>‹ More</button><h1>Career</h1><div class="panel"><h2>This week</h2>${['Polish your LinkedIn headline — draft ready', 'Ops Director roles: 3 new matches in Dubai', 'Learn: AI for route planning · 20 min'].map((t) => `<div class="item"><span class="ttl">${t}</span></div>`).join('')}</div>`;
  if (S.more === 'grow') return `<button class="back" data-mb>‹ More</button><h1>Grow</h1><div class="panel"><h2>Habits</h2>${[['Walk 8,000 steps', 70], ['Read 20 minutes', 40], ['Gym 3× this week', 66]].map(([n, p]) => `<div class="row sp"><span>${n}</span><span class="sub">${p}%</span></div><div class="bl" style="grid-template-columns:1fr"><span class="b"><i data-w="${p}"></i></span></div>`).join('')}</div>`;
  return `<div class="eyebrow">More</div><h1>Everything <span>else</span></h1>
    <div class="grid2">${[['files', 'Files', `${S.files.length} documents`], ['career', 'Career', 'Jobs and learning'], ['grow', 'Grow', 'Habits and health'], ['settings', 'Settings', 'Colour, apps, account']].map(([k, l, d]) => `<button class="tile" data-mo="${k}"><svg class="ico" viewBox="0 0 24 24">${IC[k === 'settings' ? 'set' : k]}</svg><b>${l}</b><span class="sub">${d}</span></button>`).join('')}</div>`;
};
B.more = () => {
  $$('[data-mo]').forEach((b) => (b.onclick = () => { S.more = b.dataset.mo; S.folder = ''; render(); scrollTo({ top: 0 }); }));
  $$('[data-mb]').forEach((b) => (b.onclick = () => { S.more = null; render(); }));
  if (S.more === 'files') filesBind();
};
function filesView() {
  const cur = S.folder;
  const all = new Set(); S.files.forEach((f) => { const p = f.f.split('/'); for (let i = 1; i <= p.length; i++) all.add(p.slice(0, i).join('/')); });
  const subs = [...all].filter((f) => cur ? f.startsWith(cur + '/') && !f.slice(cur.length + 1).includes('/') : !f.includes('/'));
  const here = S.files.filter((f) => f.f === cur);
  const crumbs = ['', ...cur.split('/').filter(Boolean).map((_, i, a) => a.slice(0, i + 1).join('/'))];
  return `<button class="back" data-mb>‹ More</button><h1>Files</h1>
    <div class="row" style="font-size:14px">${crumbs.map((c) => `<button class="back" data-fo="${esc(c)}" style="color:${c === cur ? 'var(--fg)' : 'var(--mute)'}">${c ? esc(c.split('/').pop()) : 'All files'}</button>`).join('<span class="sub">/</span>')}</div>
    <div class="row" style="margin:10px 0"><label class="btn" style="display:inline-flex;align-items:center">Upload<input type="file" id="fup" multiple hidden></label><span class="sub">Stays on this page — demo only</span></div>
    <div class="panel" style="padding:6px 12px">
      ${subs.map((f) => `<div class="row" data-fo="${esc(f)}" style="padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer"><span class="fic"><svg class="ico" viewBox="0 0 24 24" style="width:17px;height:17px">${IC.files}</svg></span><span class="ttl grow">${esc(f.split('/').pop())}</span><span class="sub">${S.files.filter((x) => x.f === f || x.f.startsWith(f + '/')).length}</span></div>`).join('')}
      ${here.map((f) => `<div class="row" style="padding:11px 0;border-bottom:1px solid var(--line)"><span class="fic">${esc((f.n.split('.').pop() || 'file').slice(0, 4))}</span><div class="grow"><div class="ttl">${esc(f.n)}</div><div class="sub">${esc(f.s)}</div></div><button class="ghost" data-share="${esc(f.n)}">Send</button></div>`).join('')}
      ${!subs.length && !here.length ? '<p class="empty">Empty folder.</p>' : ''}</div>
    <p class="sub">Keep passports, IDs, licences and contracts here. Dioma attaches them when someone asks — on WhatsApp or email.</p>`;
}
function filesBind() {
  $$('[data-fo]').forEach((b) => (b.onclick = () => { S.folder = b.dataset.fo; render(); }));
  $$('[data-share]').forEach((b) => (b.onclick = () => toast(`Demo: “${b.dataset.share}” ready to attach to WhatsApp or email`)));
  const up = $('#fup'); if (up) up.onchange = () => { [...up.files].forEach((f) => S.files.push({ n: f.name, f: S.folder || 'Personal', s: f.size < 1048576 ? Math.max(1, Math.round(f.size / 1024)) + ' KB' : (f.size / 1048576).toFixed(1) + ' MB' })); if (!S.folder) S.folder = 'Personal'; render(); toast(`${up.files.length} file${up.files.length === 1 ? '' : 's'} added (demo)`); };
}
function settingsView() {
  const t = document.documentElement.dataset.tone === 'mono' ? 'mono' : 'sun';
  return `<button class="back" data-mb>‹ More</button><h1>Settings</h1>
    <div class="panel"><h2>Colour</h2><div class="grid2">
      <button class="tile" data-tone="mono" style="${t === 'mono' ? 'border-color:#fff' : ''}"><span style="display:flex;gap:6px"><i style="width:18px;height:18px;border-radius:50%;background:#fff"></i><i style="width:18px;height:18px;border-radius:50%;background:#2c2c2c"></i></span><b>Mono</b><span class="sub">Black and white, calm</span></button>
      <button class="tile" data-tone="sun" style="${t === 'sun' ? 'border-color:#FFB547' : ''}"><span style="display:flex;gap:6px"><i style="width:18px;height:18px;border-radius:50%;background:#FFB547"></i><i style="width:18px;height:18px;border-radius:50%;background:#2c2c2c"></i></span><b>Sunrise</b><span class="sub">Warm amber accent</span></button></div></div>
    <div class="panel"><h2>Connected apps</h2>${[['WhatsApp', 'Personal + Business'], ['Gmail', 'sara@example.com'], ['Zoho Mail', 'sara@swiftcold.example'], ['Calendar', 'Google + Zoho'], ['Books', 'Invoices and POs']].map(([n, d]) => `<div class="row"><span class="grow"><b>${n}</b><div class="sub">${d}</div></span><span class="pill ok">Connected</span></div>`).join('')}</div>
    <div class="panel"><h2>Rules Dioma follows</h2>${['Nothing is sent without your OK', 'Follow up on email after 10 days, WhatsApp after 20', 'Business meetings never move without you', 'If it isn’t sure, it asks you first'].map((r) => `<div class="row"><span class="dot"></span><span>${r}</span></div>`).join('')}</div>`;
}

render();
</script>
</body>
